spring.application.name=starfleet-voice-interface

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5-nano
spring.ai.openai.chat.options.temperature=1.0

# Disable web server for desktop applications
spring.main.web-application-type=none

# Enable MCP client
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.toolcallback.enabled=true

# Configure STDIO connection to your osquery MCP server (native binary for instant startup)
spring.ai.mcp.client.stdio.connections.osquery.command=/Users/kennethkousen/Documents/AI/OsqueryMcpServer/build/native/nativeCompile/OsqueryMcpServer
spring.ai.mcp.client.stdio.connections.osquery.args=